title: MS<sup>3</sup>L
title_plain: MS3L
description: Membrane-based Sustainable Separation Solutions Laboratory
# Custom domain. The CNAME file at the repo root is what GitHub Pages reads;
# these two drive every absolute URL Jekyll writes - canonical tags, OpenGraph,
# the sitemap - so they have to move together with it.
baseurl: ""
url: "https://ms3l.org"
markdown: kramdown
theme: null

# Cloudflare Web Analytics beacon. Public by nature - it ships in the page
# source - and only identifies which dashboard to report to. Injected in
# _layouts/default.html, production builds only.
cloudflare_analytics_token: "8cbbc8da2a5d4215918d3e4a6749ef14"

# Generates /sitemap.xml from the built pages, so Search Console has a page
# list to crawl. The three redirect stubs already carry `sitemap: false`.
plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile.dev
  - compose.dev.yaml
  - _config_dev.yml
  - README.md
  # jekyll-readme-index is on by default for GitHub Pages, so this internal
  # note was publishing as a real page at /assets/images/ and landing in the
  # sitemap.
  - assets/images/README.md
  - certs/
  - docs/
  - scripts/
  - vendor/
  - .venv/
  - .bundle/
  - .bundle-user/
  - .vscode/
  - assets/images/imported/
