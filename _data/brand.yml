# MS3L brand values. Single source for the palette so the stylesheet, the logo
# set and the slide template cannot drift apart. Colours are KRICT's own, read
# out of their stylesheets rather than picked by eye.
palette:
  - name: Lab navy
    hex: "#0B2F5B"
    role: Headings and body emphasis. 13.4:1 on white
  - name: KRICT blue
    hex: "#0075C2"
    pantone: 3015C
    role: Links and small text - the only CI colour that clears 4.5:1 (4.86:1)
  - name: KRICT blue, light
    hex: "#0099D9"
    pantone: 3005C
    role: Gradient midpoint. Graphics only, 3.2:1
  - name: KRICT teal
    hex: "#00ADA9"
    pantone: 632C
    role: Gradient end. Graphics only - 2.78:1, never as text
  - name: Teal, text-safe
    hex: "#009B96"
    role: Where the teal end of the ramp has to be a letter. 3.4:1
  - name: Surface
    hex: "#F4F8FD"
    role: Card and panel ground

# Values are KRICT's published CI (krict.re.kr/kor/sub01_05_01.do). They are
# bright, so the rule is by role: CI colours carry the graphics, and text falls
# back to #0075C2 or the lab navy.

gradient: "linear-gradient(135deg, #0075C2 0%, #0099D9 45%, #00ADA9 100%)"

# Where each mark belongs. Files live in assets/images/logo/.
marks:
  - file: ms3l-avatar.png
    use: Default. Chat and profile avatars
  - file: ms3l-avatar-circle.png
    use: Transparent ground. Use inside slides and on any colour
  - file: ms3l-avatar-fill.png
    use: Full-bleed gradient. Bold placements, social
  - file: ms3l-avatar-dark.png
    use: Dark grounds
  - file: ms3l-avatar-solid.png
    use: Solid ring alternate, quieter
  - file: ms3l-favicon.png
    use: >-
      Browser tab. Reduced to S3, not M3 - the 3 counts the three S words
      (Sustainable, Separation, Solutions), so S3 is the part of the name that
      survives shortening. Four glyphs cannot resolve at 16px.
  - file: ms3l-favicon-light.png
    use: The same mark on white with a navy S and a teal 3. Bookmark bars and
      app icons, where the tile is large enough to keep its edge
  - file: ms3l-lockup-horizontal.png
    use: Slides, letterhead, posters
  - file: ms3l-lockup-horizontal-white.png
    use: The lockup on dark or gradient grounds. Transparent
  - file: logos/krict-logo.png
    use: >-
      The institution's own mark, from KRICT's CI page. Sits beside the MS3L
      wordmark in the header and under the institution line in the footer, so
      where the lab sits is readable at a glance
  - file: logos/krict-logo-white.png
    use: The same mark in white, for dark and gradient grounds

type:
  slides: Pretendard, or Noto Sans KR where Pretendard is not installed
  website: Inter, falling back to Noto Sans KR
  fallback: Malgun Gothic - present on every Windows machine, last resort only

sheet: /assets/images/logo/ms3l-brand-sheet.png
