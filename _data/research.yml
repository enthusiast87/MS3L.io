- title: Biorefinery
  summary: Integrated conversion and membrane-enabled separations for sustainable biorefinery operations.
  one_liner: Carbon-efficient routes from biomass to purified platform chemicals.
  why_it_matters: >-
    We connect biomass conversion chemistry to low-energy separation pathways that replace
    neutralization-heavy and solvent-intensive purification steps, so that platform chemicals from
    edible and non-edible feedstocks reach usable purity at viable yield, cost, and carbon footprint.
  image: /assets/images/research/biorefinery.jpg
  image_alt: Biorefinery separation workflow and recovery concept for biomass-derived products.
  visual_caption: Membrane-assisted recovery routes for biomass-derived acids, bases, and purified product streams.
  application_examples:
    - Biomass platform chemicals
    - Non-edible feedstock valorization
    - Organic acid purification
    - Acid and base regeneration
  visual_points:
    - Focuses on replacing neutralization-heavy purification steps with membrane-enabled recovery.
    - Highlights how acidification, product recovery, and reagent recycle can be integrated in one train.
    - Treats conversion and separation as one process, evaluated on overall yield and carbon footprint.
  topics:
    - Platform chemical production
    - Product recovery
    - Base catalyst recycling
    - Product acidification
  key_methods:
    - Diffusion dialysis and membrane-assisted ion exchange
    - Bipolar membrane electrodialysis for acid/base generation
    - Integrated purification train design and system-level optimization
    - Scale-up demonstration and life cycle assessment of full conversion routes
  selected_papers:
    - title: A new integrated process from non-edible biomass to 2,5-furandicarboxylic acid via 5-bromomethylfurfural and 5-acetoxymethylfurfural intermediates
      year: 2026
      venue: Chemical Engineering Journal
      url: https://doi.org/10.1016/j.cej.2026.181043
    - title: Simultaneous CO2 mineralization and organic acid purification via diffusion dialysis process
      year: 2025
      venue: Chemical Engineering Journal
      url: https://doi.org/10.1016/j.cej.2025.165207

- title: Plastic recycling
  summary: Selective purification and solvent/catalyst recovery for circular plastics.
  one_liner: Membrane-enabled depolymerization and monomer purification for circular plastics.
  why_it_matters: >-
    We develop selective separation routes that reduce process heat duty and solvent loss,
    making chemical recycling of mixed polymer streams more scalable and sustainable.
  image: /assets/images/research/plastic-recycling.jpg
  image_alt: Circular plastics workflow with membrane-enabled solvent and monomer recovery.
  visual_caption: Circular separation schemes for depolymerization products, solvent recycle, and catalyst recovery.
  application_examples:
    - PET and polystyrene upcycling
    - Solvent recovery loops
    - Monomer purification
  visual_points:
    - Emphasizes closed-loop separation around depolymerization rather than one-pass purification.
    - Connects selective membrane recovery with lower solvent loss and lower thermal load.
  topics:
    - Monomer purification
    - Solvent recycling
    - Base catalyst recycling
  key_methods:
    - Membrane-coupled glycolysis and depolymerization workflows
    - Solvent-resistant membrane purification
    - Circular process integration for catalyst and solvent reuse
  selected_papers:
    - title: "Process modeling and assessment of waste polystyrene pyrolysis: Comparing catalytic and thermal methods"
      year: 2025
      venue: Chemical Engineering Journal
      url: https://doi.org/10.1016/j.cej.2025.159261
    - title: Ir(triNHC)-Catalyzed Upcycling of Waste PET for Lactic Acid Production with Sustainable Isolation via Bipolar Membrane Electrodialysis
      year: 2024
      venue: Angewandte Chemie
      url: https://doi.org/10.1002/ange.202410003

- title: Resource recovery
  summary: Recovery and purification of valuable species from complex liquid streams.
  one_liner: Recovering value from dilute and contaminated streams with membrane process intensification.
  why_it_matters: >-
    We target difficult feed streams where conventional purification is expensive,
    and design membrane-first pathways for resource circulation and waste minimization.
  image: /assets/images/research/resource-recovery.jpg
  image_alt: Resource recovery concept showing concentration, crystallization, and selective purification.
  visual_caption: Intensified recovery routes for dilute, mixed, or contamination-prone liquid streams.
  application_examples:
    - Valuable salt recovery
    - Water reuse
    - Concentration and crystallization
  visual_points:
    - Shows how value can be recovered from streams that are traditionally treated as waste.
    - Pairs concentration and selective purification steps to improve product quality and water reuse.
  topics:
    - Membrane distillation and crystallization
    - Solvent recycling
  key_methods:
    - Membrane distillation for concentration and water recovery
    - Coupled crystallization and selective separation
    - Separation train synthesis for high-purity product isolation
  selected_papers:
    - title: Advancing membrane technology in organic liquids towards a sustainable future
      year: 2025
      venue: Nature Sustainability
      url: https://doi.org/10.1038/s41893-025-01570-4
    - title: Thermally rearranged polymer membranes for desalination
      year: 2016
      venue: Energy & Environmental Science
      url: https://doi.org/10.1039/C5EE03768A

- title: Energy-related applications
  summary: Membrane and separation technologies for energy conversion and storage.
  one_liner: Advanced membrane materials and modules for clean energy systems.
  why_it_matters: >-
    We advance membrane materials and hybrid configurations that improve energy efficiency,
    process reliability, and commercialization potential in energy and battery applications.
  image: /assets/images/research/energy.jpg
  image_alt: Energy-related membrane applications spanning biofuels, osmosis modules, and battery materials.
  visual_caption: Membrane materials and modules tailored for fuel, osmotic, and electrochemical systems.
  application_examples:
    - Biofuel separations
    - Pressure-retarded osmosis
    - Battery separator materials
  visual_points:
    - Frames membrane design as part of larger energy conversion and storage systems.
    - Links material-level selectivity to module reliability and process-scale performance.
  topics:
    - Biofuel production
    - Pressure retarded osmosis
    - Lithium-ion battery separator
  key_methods:
    - Thin-film composite membrane design
    - Pressure-retarded osmosis module optimization
    - Membrane-electrochemical interface engineering
  selected_papers:
    - title: Low energy-intensive production of fuel-grade bio-butanol enabled by membrane-based extraction
      year: 2020
      venue: Energy & Environmental Science
      url: https://doi.org/10.1039/D0EE02927K
    - title: A robust thin film composite membrane incorporating thermally rearranged polymer support for organic solvent nanofiltration and pressure retarded osmosis
      year: 2018
      venue: Journal of Membrane Science
      url: https://doi.org/10.1016/j.memsci.2018.01.008
