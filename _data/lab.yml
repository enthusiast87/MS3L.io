hero:
  mission: We develop membrane-enabled, low-energy separation technologies for circular chemical processes, resource recovery, and sustainable energy applications.

research:
  title: Research Themes
  lead: Core areas currently highlighted across the lab's research portfolio.

approach:
  title: From membrane science to process impact
  lead: MS<sup>3</sup>L connects molecular-scale membrane design to scalable process performance in chemically demanding liquid systems.
  areas:
    - title: Molecular selectivity
      summary: Designing membranes and interfaces for challenging ion and organic-liquid separations.
    - title: Process integration
      summary: Linking membrane performance to practical recovery, purification, and recycle schemes.
    - title: Circular systems
      summary: Applying separation science to biorefinery, recycling, and energy-related resource loops.
    - title: Scale-up relevance
      summary: Connecting lab-scale membrane insight to robust operating windows, modules, and deployable process conditions.

introduction:
  title: Introduction
  overview:
    - Membrane-based Sustainable Separation Solutions Laboratory (MS<sup>3</sup>L) develops membrane-based technologies for energy-efficient ion and liquid separations in sustainable chemical processes, circular resource systems, and energy applications.
    - Our research integrates separation science, process design, and membrane engineering to build practical low-energy solutions for chemically demanding liquid systems.
  priorities:
    - Sustainable biorefinery and product recovery
    - Circular plastic and solvent systems
    - Resource recovery from complex liquid streams
    - Membrane-enabled energy and electrochemical separations
  principal_investigator:
    name: Jihoon Kim
    current_period: March 2026 - present
    current_appointments:
      - title: Principal Researcher
        organization: Korea Research Institute of Chemical Technology (KRICT)
      - title: Associate Professor
        organization: Advanced Materials and Chemical Engineering, University of Science and Technology (UST)
    career:
      - title: Senior Researcher
        period: 2021 - February 2026
        affiliation: Chemical Process Technology Division, Korea Research Institute of Chemical Technology (KRICT)
      - title: Postdoctoral Research Associate in Chemical Engineering
        period: 2018 - 2021
        affiliation: Imperial College London
        note: Prof. Andrew G. Livingston
      - title: Integrated MS-PhD in Energy Engineering
        period: 2012 - 2017
        affiliation: Hanyang University
        note: Prof. Young Moo Lee
      - title: BS in Chemical Engineering
        period: 2006 - 2008, 2010 - 2012
        affiliation: Hanyang University
    biography:
      - Dr. Jihoon Kim received his BS in Chemical Engineering from Hanyang University in 2012 and became a regular member of the Young Engineers Honour Society (YEHS) of the National Academy of Engineering of Korea.
      - He completed an integrated MS-PhD program in Energy Engineering at Hanyang University under Prof. Young Moo Lee. His graduate research covered lithium-ion battery separators, pressure-retarded osmosis, membrane distillation, and organic solvent nanofiltration, including collaborative research in Prof. Andrew G. Livingston's group at Imperial College London.
      - After earning his PhD in 2017, he joined Imperial College London as a Postdoctoral Research Associate in 2018. There, he expanded his research into membrane technologies for biofuel recovery, crude-oil fractionation, iterative synthesis, and precision separation.
      - He began his independent research career at KRICT in 2021. His work connects fundamental membrane science with practical, scalable separation technologies for carbon-neutral and resource-circulating chemical processes.
      - His research record includes publications in Energy & Environmental Science, Nature Sustainability, Angewandte Chemie, Journal of Membrane Science, Chemical Engineering Journal, and Science, together with industrial know-how consultancy for Evonik Industries and technology transfer to Lotte Chemical.
    research_interests:
      - Sustainable membrane-based separation systems for ion and liquid separations, supported by transport phenomena, membrane material design, and process engineering.
      - Practical membrane processes for biofuel recovery, crude-oil fractionation, iterative synthesis, resource circulation, and carbon-neutral chemical manufacturing, with particular emphasis on robustness, scalability, waste minimization, and energy efficiency.

